[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "lupaxa-qrcode-generator"
dynamic = ["version"]
description = "CLI and library to generate QR codes for text, Wi-Fi, contacts, email, SMS, locations, and calendar events."
readme = "README-PYPI.md"
license = { file = "LICENCE" }
requires-python = ">=3.10"

authors = [
  { name = "The Lupaxa Project" }
]

keywords = ["qrcode", "qr-code", "cli", "segno", "wifi", "vcard"]

dependencies = [
  "segno>=1.6",
]

classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Utilities",
]

[project.urls]
Homepage = "https://qrcode-generator.thelupaxaproject.org/"
Documentation = "https://qrcode-generator.thelupaxaproject.org/"
Repository = "https://github.com/lupaxa-developers-toolbox/qrcode-generator"
Issues = "https://github.com/lupaxa-developers-toolbox/qrcode-generator/issues"

[project.scripts]
qrcode-generator = "lupaxa.qrcode_generator.cli:main"
qrcodes = "lupaxa.qrcode_generator.cli:main"

[project.optional-dependencies]
logo = [
  "pillow>=10.0",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6.0",
  "mypy>=1.12.0",
  "hatch>=1.12.0",
  "bump-my-version>=1.2.0",
  "mkdocs==1.6.1",
  "mkdocs-material==9.7.7",
  "pillow>=10.0",
]
test = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pillow>=10.0",
]

[tool.hatch.version]
path = "src/lupaxa/qrcode_generator/version.py"

[tool.hatch.build.targets.sdist]
include = [
  "src/**",
  "README.md",
  "README-PYPI.md",
  "LICENCE",
]

[tool.hatch.build.targets.wheel]
packages = ["src/lupaxa"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
files = ["src", "tests"]
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra -q --disable-warnings"
testpaths = ["tests"]
pythonpath = ["src"]
